# Push a tag like v0.2.0 (matching package.json's version) to release:
#
#   1. build: the test suite, then halo for every platform (scripts/release.ts), with each
#      Linux build run in a container (glibc, musl, arm64 under emulation)
#   2. macos, windows: the builds run on real macOS and Windows, installed by install.sh and
#      install.ps1 from a local copy of the release, the way users install them
#   3. publish: a GitHub release with the binaries and SHA256SUMS, the same files to
#      halolang.com/dl (R2), then the site
#   4. image: ghcr.io/cmjio/halo for amd64 and arm64, from the Linux binaries (docker/)
#   5. npm: @halolang/halo and its per-platform binary packages (scripts/npm.ts, npm/)
#
# Publishing to halolang.com needs the CLOUDFLARE_API_TOKEN secret and the
# CLOUDFLARE_ACCOUNT_ID variable (see .github/RELEASING.md).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.4

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - id: version
        name: The tag matches package.json
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test, then build every platform
        run: bun scripts/release.ts --no-upload
      - uses: docker/setup-qemu-action@v3
      - name: Run the Linux builds in containers
        run: |
          d="$PWD/dist/release/${{ steps.version.outputs.version }}"
          docker run --rm -v "$d:/r:ro" debian:bookworm-slim /r/halo-linux-x64 --version
          docker run --rm -v "$d:/r:ro" debian:bookworm-slim /r/halo-linux-x64-baseline --version
          docker run --rm -v "$d:/r:ro" alpine:3.20 sh -c "apk add -q libstdc++ libgcc && /r/halo-linux-x64-musl --version"
          docker run --rm --platform linux/arm64 -v "$d:/r:ro" debian:bookworm-slim /r/halo-linux-arm64 --version
          docker run --rm --platform linux/arm64 -v "$d:/r:ro" alpine:3.20 sh -c "apk add -q libstdc++ libgcc && /r/halo-linux-arm64-musl --version"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/
          if-no-files-found: error

  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - name: install.sh installs it, and it runs
        run: |
          (cd dist/release && python3 -m http.server 8731 >/dev/null 2>&1 &)
          sleep 2
          export HALO_DOWNLOAD_BASE=http://127.0.0.1:8731 HALO_INSTALL="$RUNNER_TEMP/halo" HALO_NO_MODIFY_PATH=1
          sh docs/public/install.sh
          H="$RUNNER_TEMP/halo/bin/halo"
          test "$("$H" --version)" = "${{ needs.build.outputs.version }}"
          cd "$(mktemp -d)" && "$H" init demo && cd demo && "$H" test main.halo --arg topic=tides

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - name: install.ps1 installs it, and it runs
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8731' -WorkingDirectory dist/release -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:HALO_DOWNLOAD_BASE = 'http://127.0.0.1:8731'
          $env:HALO_INSTALL = Join-Path $env:RUNNER_TEMP 'halo'
          $env:HALO_NO_MODIFY_PATH = '1'
          ./docs/public/install.ps1
          $halo = Join-Path $env:HALO_INSTALL 'bin/halo.exe'
          $v = & $halo --version
          if ($v -ne '${{ needs.build.outputs.version }}') { throw "halo --version printed $v" }
          $dir = Join-Path $env:RUNNER_TEMP 'proj'
          New-Item -ItemType Directory $dir | Out-Null
          Set-Location $dir
          & $halo init demo
          if ($LASTEXITCODE -ne 0) { throw 'halo init failed' }
          Set-Location demo
          & $halo test main.halo --arg topic=tides
          if ($LASTEXITCODE -ne 0) { throw 'halo test failed' }
          Stop-Process -Id $server.Id

  # ghcr.io/cmjio/halo:<version>, :<major.minor> and :latest, for amd64 and arm64, from the
  # binaries built above. The amd64 image uses the baseline build, so it runs on any x64 CPU.
  image:
    needs: [build, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - name: Lay out the binaries by architecture
        run: |
          mkdir -p ctx/amd64 ctx/arm64
          cp "dist/release/$VERSION/halo-linux-x64-baseline" ctx/amd64/halo
          cp "dist/release/$VERSION/halo-linux-arm64" ctx/arm64/halo
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/halo"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "TAGS=$image:$VERSION,$image:${VERSION%.*},$image:latest" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: The amd64 image runs
        run: |
          docker buildx build --platform linux/amd64 --load -t halo:test -f docker/Dockerfile ctx
          bash docker/smoke-test.sh halo:test "$VERSION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.description=Halo: serve and run .halo pipelines
            org.opencontainers.image.licenses=MIT

  # @halolang/halo and its @halolang/halo-<platform> binary packages (scripts/npm.ts), with
  # provenance. Needs the NPM_TOKEN secret; without it this job warns and skips npm.
  npm:
    needs: [build, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - run: bun scripts/npm.ts
      - name: The packages install and run (linux-x64)
        run: |
          rm -rf dist/npm-check && mkdir dist/npm-check
          cp -r dist/npm/halo dist/npm/halo-linux-x64 dist/npm-check/
          node -e 'const f="dist/npm-check/halo/package.json",p=require("./"+f);p.optionalDependencies={"@halolang/halo-linux-x64":p.version};require("fs").writeFileSync(f,JSON.stringify(p,null,2))'
          bash npm/smoke-test.sh dist/npm-check
      - name: Publish to npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::Set the NPM_TOKEN secret to publish @halolang/halo to npm (see .github/RELEASING.md). Skipped npm."
            exit 0
          fi
          bun scripts/npm.ts --publish

  publish:
    needs: [build, macos, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      # A rerun (say, after the halolang.com step failed) replaces the files of the release it already made.
      - name: GitHub release
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/release/$VERSION/* --clobber
          else
            gh release create "v$VERSION" dist/release/$VERSION/* --title "Halo $VERSION" --generate-notes --verify-tag
          fi
      - name: halolang.com/dl, and the site
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to publish to halolang.com (see .github/RELEASING.md). The GitHub release is published."
            exit 1
          fi
          bun scripts/release.ts --upload-only
          bun site/build.ts --no-tests
          bunx wrangler deploy --config site/wrangler.jsonc
