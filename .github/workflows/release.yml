# Three channels (src/channel.ts), each with its own halolang.com/dl/<channel>.json, npm dist-tag
# and image tag:
#
#   latest   push a tag like v1.2.0 (matching package.json's version)
#   next     push a prerelease tag like v1.3.0-next.1 or v1.3.0-rc.1 (matching package.json):
#            a GitHub prerelease, @halolang/halo@next, ghcr.io/cmjio/halo:next
#   nightly  every night from main, when main has changed since the last nightly (or by hand:
#            Actions → Release → Run workflow). The version is made up from package.json's
#            (1.2.0 → 1.2.1-nightly.20261113.g9172379) and never committed or tagged; no GitHub
#            release, just halolang.com/dl, npm @nightly and the :nightly image.
#
# Only latest deploys the site's pages. Next and nightly redeploy the worker (with the latest
# release's pages) only if the live worker can't serve their pointer yet.
#
# Each run:
#
#   0. plan: which version and channel, or nothing to do
#   1. build: the test suite, then halo for every platform (scripts/release.ts), with each
#      Linux build run in a container (glibc, musl, arm64 under emulation)
#   2. macos, windows: the builds run on real macOS and Windows, installed by install.sh and
#      install.ps1 from a local copy of the release, the way users install them
#   3. publish: a GitHub release with the binaries and SHA256SUMS, the same files to
#      halolang.com/dl (R2), then the site
#   4. image: ghcr.io/cmjio/halo for amd64 and arm64, from the Linux binaries (docker/)
#   5. npm: @halolang/halo and its per-platform binary packages (scripts/npm.ts, npm/)
#
# Publishing to halolang.com needs the CLOUDFLARE_API_TOKEN secret and the
# CLOUDFLARE_ACCOUNT_ID variable (see .github/RELEASING.md).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "23 4 * * *" # nightly, 04:23 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Build a nightly even if main hasn't changed since the last one
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time per ref; a nightly never cancels a release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.4

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: plan
        name: Which version, on which channel
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(jq -r .version package.json)
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Nightlies are built from main, not $GITHUB_REF"
              exit 1
            fi
            last=$(curl -fsSL --retry 3 https://halolang.com/dl/nightly.json 2>/dev/null | jq -r '.commit // empty' || true)
            if [ "$last" = "$GITHUB_SHA" ] && [ "$FORCE" != true ]; then
              echo "main hasn't changed since the last nightly ($GITHUB_SHA); nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version=$(bun -e 'import { nightlyVersion } from "./src/channel"; import pkg from "./package.json"; console.log(nightlyVersion(pkg.version, new Date(), process.env.GITHUB_SHA))')
          fi
          channel=$(bun -e 'import { channelOf } from "./src/channel"; console.log(channelOf(process.argv[1]))' "$version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$channel" = nightly ]; then
            echo "::error::Nightly versions come from the schedule; tag a release (v1.2.0) or a prerelease (v1.3.0-next.1) instead"
            exit 1
          fi
          echo "Releasing $version on $channel"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # A nightly's version is set here, not committed (a tag's is already package.json's).
      - name: Set the version
        run: jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
      - name: Test, then build every platform
        run: bun scripts/release.ts --no-upload
      - uses: docker/setup-qemu-action@v3
      - name: Run the Linux builds in containers
        run: |
          d="$PWD/dist/release/$VERSION"
          docker run --rm -v "$d:/r:ro" debian:bookworm-slim /r/halo-linux-x64 --version
          docker run --rm -v "$d:/r:ro" debian:bookworm-slim /r/halo-linux-x64-baseline --version
          docker run --rm -v "$d:/r:ro" alpine:3.20 sh -c "apk add -q libstdc++ libgcc && /r/halo-linux-x64-musl --version"
          docker run --rm --platform linux/arm64 -v "$d:/r:ro" debian:bookworm-slim /r/halo-linux-arm64 --version
          docker run --rm --platform linux/arm64 -v "$d:/r:ro" alpine:3.20 sh -c "apk add -q libstdc++ libgcc && /r/halo-linux-arm64-musl --version"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/
          if-no-files-found: error

  macos:
    needs: [plan, build]
    runs-on: macos-latest
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - name: install.sh installs it, and it runs
        run: |
          (cd dist/release && python3 -m http.server 8731 >/dev/null 2>&1 &)
          # Wait until the server answers (a fixed sleep raced it), for up to 30s.
          for i in $(seq 30); do curl -sf -o /dev/null "http://127.0.0.1:8731/$CHANNEL.json" && break; sleep 1; done
          curl -sf -o /dev/null "http://127.0.0.1:8731/$CHANNEL.json" || { echo "::error::The local download server didn't start"; exit 1; }
          # Install by channel name, the way users of next and nightly do.
          export HALO_DOWNLOAD_BASE=http://127.0.0.1:8731 HALO_INSTALL="$RUNNER_TEMP/halo" HALO_NO_MODIFY_PATH=1 HALO_VERSION="$CHANNEL"
          sh docs/public/install.sh
          H="$RUNNER_TEMP/halo/bin/halo"
          test "$("$H" --version)" = "${{ needs.plan.outputs.version }}"
          cd "$(mktemp -d)" && "$H" init demo && cd demo && "$H" test main.halo --arg topic=tides

  windows:
    needs: [plan, build]
    runs-on: windows-latest
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - name: install.ps1 installs it, and it runs
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8731' -WorkingDirectory dist/release -PassThru -WindowStyle Hidden
          # Wait until the server answers (a fixed sleep raced it), for up to 30s.
          $up = $false
          for ($i = 0; $i -lt 30 -and -not $up; $i++) {
            try { Invoke-WebRequest "http://127.0.0.1:8731/$env:CHANNEL.json" -UseBasicParsing -TimeoutSec 2 | Out-Null; $up = $true } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { throw "The local download server didn't start" }
          $env:HALO_DOWNLOAD_BASE = 'http://127.0.0.1:8731'
          $env:HALO_INSTALL = Join-Path $env:RUNNER_TEMP 'halo'
          $env:HALO_NO_MODIFY_PATH = '1'
          $env:HALO_VERSION = $env:CHANNEL
          ./docs/public/install.ps1
          $halo = Join-Path $env:HALO_INSTALL 'bin/halo.exe'
          $v = & $halo --version
          if ($v -ne '${{ needs.plan.outputs.version }}') { throw "halo --version printed $v" }
          $dir = Join-Path $env:RUNNER_TEMP 'proj'
          New-Item -ItemType Directory $dir | Out-Null
          Set-Location $dir
          & $halo init demo
          if ($LASTEXITCODE -ne 0) { throw 'halo init failed' }
          Set-Location demo
          & $halo test main.halo --arg topic=tides
          if ($LASTEXITCODE -ne 0) { throw 'halo test failed' }
          Stop-Process -Id $server.Id

  # For amd64 and arm64, from the binaries built above, tagged by channel: a release is
  # :<version>, :<major.minor> and :latest; a prerelease :<version> and :next; a nightly
  # :nightly. The amd64 image uses the baseline build, so it runs on any x64 CPU.
  image:
    needs: [plan, build, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - name: Lay out the binaries by architecture
        run: |
          mkdir -p ctx/amd64 ctx/arm64
          cp "dist/release/$VERSION/halo-linux-x64-baseline" ctx/amd64/halo
          cp "dist/release/$VERSION/halo-linux-arm64" ctx/arm64/halo
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/halo"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          case "$CHANNEL" in
            latest) tags="$image:$VERSION,$image:${VERSION%.*},$image:latest" ;;
            next) tags="$image:$VERSION,$image:next" ;;
            nightly) tags="$image:nightly" ;;
          esac
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: The amd64 image runs
        run: |
          docker buildx build --platform linux/amd64 --load -t halo:test -f docker/Dockerfile ctx
          bash docker/smoke-test.sh halo:test "$VERSION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.description=Halo: serve and run .halo pipelines
            org.opencontainers.image.licenses=MIT

  # @halolang/halo and its @halolang/halo-<platform> binary packages (scripts/npm.ts), with
  # provenance. Publishes with npm trusted publishing (OIDC, the id-token permission), so it
  # needs no token: each package names this repository and release.yml as its trusted
  # publisher on npmjs.com (see .github/RELEASING.md). Published under the channel's dist-tag.
  npm:
    needs: [plan, build, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set the version
        run: jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # No registry-url: that writes an .npmrc with a placeholder token, and npm should
      # authenticate with the workflow's OIDC token instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - run: bun scripts/npm.ts
      - name: The packages install and run (linux-x64)
        run: |
          rm -rf dist/npm-check && mkdir dist/npm-check
          cp -r dist/npm/halo dist/npm/halo-linux-x64 dist/npm-check/
          node -e 'const f="dist/npm-check/halo/package.json",p=require("./"+f);p.optionalDependencies={"@halolang/halo-linux-x64":p.version};require("fs").writeFileSync(f,JSON.stringify(p,null,2))'
          bash npm/smoke-test.sh dist/npm-check
      - name: Publish to npm
        run: bun scripts/npm.ts --publish
      - name: Keep npm's logs when publishing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: ~/.npm/_logs/
          if-no-files-found: ignore

  publish:
    needs: [plan, build, macos, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Set the version
        run: jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      # Releases and prereleases (marked as such) get a GitHub release; nightlies have no tag, so none.
      # A rerun (say, after the halolang.com step failed) replaces the files of the release it already made.
      - name: GitHub release
        if: env.CHANNEL != 'nightly'
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/release/$VERSION/* --clobber
          else
            pre=$([ "$CHANNEL" = next ] && echo --prerelease || true)
            gh release create "v$VERSION" dist/release/$VERSION/* --title "Halo $VERSION" --generate-notes --verify-tag $pre
          fi
      # The site's pages show the stable version, so a stable release redeploys them. Next and
      # nightly only need the worker to serve their pointer (next.json, nightly.json): when the
      # live one doesn't (it predates channels), the latest release's pages are redeployed with
      # this commit's worker, so `HALO_VERSION=next|nightly` works without showing unreleased docs.
      - name: halolang.com/dl, and the site
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to publish to halolang.com (see .github/RELEASING.md). The GitHub release is published."
            exit 1
          fi
          bun scripts/release.ts --upload-only
          if [ "$CHANNEL" = latest ]; then
            bun site/build.ts --no-tests
            bunx wrangler deploy --config site/wrangler.jsonc
          elif ! curl -fsS -o /dev/null -H "cache-control: no-cache" "https://halolang.com/dl/$CHANNEL.json"; then
            stable="v$(curl -fsSL --retry 3 https://halolang.com/dl/latest.json | jq -r .version)"
            echo "halolang.com/dl/$CHANNEL.json isn't served; redeploying the $stable site with this commit's worker"
            git fetch --depth=1 origin "refs/tags/$stable:refs/tags/$stable"
            dir="$RUNNER_TEMP/site-$stable"
            git worktree add --detach "$dir" "$stable"
            cp site/worker.ts "$dir/site/worker.ts"
            (cd "$dir" && bun install --frozen-lockfile && bun site/build.ts --no-tests && bunx wrangler deploy --config site/wrangler.jsonc)
            curl -fsS -o /dev/null --retry 5 --retry-all-errors --retry-delay 5 "https://halolang.com/dl/$CHANNEL.json" \
              || { echo "::error::halolang.com/dl/$CHANNEL.json still isn't served after redeploying the worker"; exit 1; }
          fi
