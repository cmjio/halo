id = "halo"
name = "Halo DSL"
version = "0.3.0"
schema_version = 2
description = "Halo (.halo files): highlighting, errors as you type, completion, hover, go to definition, references, rename and the outline"
repository = "https://github.com/cmjio/halo"
authors = []
themes = []
icon_themes = []
languages = ["languages/halo"]

# Zed builds the grammar from this repository at `rev` (a commit that has the
# generated src/), cloned from GitHub. Zed clones it
# into grammars/, so the grammar source lives outside this folder. After
# changing grammar.js: run ./build.sh, commit, and set `rev` to that commit.
[grammars.halo]
repository = "https://github.com/cmjio/halo"
rev = "059d7f0d37035168562531d16cac84fbc075ea3f"
path = "editors/tree-sitter-halo"

# The language server is `halo lsp` from the halo on your PATH (src/halo.rs starts it).
[language_servers.halo]
name = "Halo"
languages = ["Halo"]

[context_servers]

[agent_servers]

[slash_commands]
