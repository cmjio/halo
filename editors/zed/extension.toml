id = "halo"
name = "Halo DSL"
version = "0.1.0"
schema_version = 2
description = "Syntax highlighting for the Halo DSL (.halo files)"
repository = "https://github.com/cmjio/halo"
authors = []
themes = []
icon_themes = []
languages = ["languages/halo"]

# Zed builds the grammar from this repository at `rev` (a commit that has the
# generated src/), cloned from GitHub. Zed clones it
# into grammars/, so the grammar source lives outside this folder. After
# changing grammar.js: run ./build.sh, commit, and set `rev` to that commit.
[grammars.halo]
repository = "https://github.com/cmjio/halo"
rev = "1b0353b3dee70474132451c515f87a33920f2ea4"
path = "editors/tree-sitter-halo"

[language_servers]

[context_servers]

[agent_servers]

[slash_commands]
