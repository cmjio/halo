<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Halo's launch trailer. A pure function of time: window.render(t) sets every element for
     second t, so trailer.ts can screenshot it frame by frame. The character is the logo:
     an orb (the agent) and the ring above it (the halo: the rules). -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10; --panel: #13161b; --line: #232830; --text: #e8eaee; --muted: #8e96a2;
    --amber: #f3b44c; --amber-2: #ffcf7a; --green: #56d39a; --red: #ff7b72; --violet: #b9a3f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "IBM Plex Mono", monospace; font-variant-ligatures: none; }
  .abs { position: absolute; left: 0; top: 0; }
  .layer { position: absolute; inset: 0; }
  #world { position: absolute; inset: 0; transform-origin: 960px 540px; }
  #bg { position: absolute; inset: 0; background: radial-gradient(1200px 760px at 50% 46%, #141820, var(--bg) 70%); }
  #tint { position: absolute; inset: 0; background: radial-gradient(900px 600px at 50% 52%, rgba(255,90,70,.55), transparent 70%); opacity: 0; mix-blend-mode: screen; }
  #grid { position: absolute; inset: -80px; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 80px 80px; opacity: 0; -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 70%); }
  #grain { position: absolute; inset: -20%; opacity: .075; mix-blend-mode: overlay; pointer-events: none; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.55)); pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #l4 { background: radial-gradient(1200px 760px at 50% 46%, #141820, #0b0d10 70%); }
  #fill { position: absolute; inset: 0; background: var(--amber); opacity: 0; }
  #black { position: absolute; inset: 0; background: #000; opacity: 0; }

  /* the character */
  .orb { position: absolute; left: 0; top: 0; width: 460px; height: 460px; overflow: visible; will-change: transform; }

  /* kinetic headlines */
  .headline { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 68px; letter-spacing: -2.4px; line-height: 1.1; white-space: nowrap; }
  .headline .w { display: inline-block; margin: 0 .13em; }
  .headline .a { color: var(--amber); }
  .headline .r { color: var(--red); }
  .headline .g { color: var(--green); }
  .sub { position: absolute; left: 0; right: 0; text-align: center; font-size: 30px; color: var(--muted); }

  /* tool chips */
  .chip { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-radius: 16px; background: rgba(21,24,30,.94); border: 1.5px solid #343b46; font: 500 26px/1 "IBM Plex Mono", monospace; white-space: nowrap; box-shadow: 0 18px 40px -18px rgba(0,0,0,.9); will-change: transform; }
  .chip i { width: 12px; height: 12px; border-radius: 50%; background: currentColor; flex: none; }
  .chip.read { color: var(--green); border-color: rgba(86,211,154,.45); }
  .chip.write { color: var(--amber); border-color: rgba(243,180,76,.45); }
  .chip.ext { color: var(--red); border-color: rgba(255,123,114,.5); }
  .chip b { color: var(--text); font-weight: 500; }
  .pt { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 2px; will-change: transform; }
  .ring { position: absolute; left: 0; top: 0; border-radius: 50%; border: 3px solid #fff; }

  /* counter */
  #spend { position: absolute; right: 110px; bottom: 90px; text-align: right; }
  #spend small { display: block; font: 500 20px/1 "IBM Plex Mono", monospace; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
  #spend b { font: 600 64px/1 "IBM Plex Mono", monospace; color: var(--red); letter-spacing: -1px; }

  /* wordmark */
  .wordmark { position: absolute; font-weight: 700; font-size: 220px; letter-spacing: -9px; line-height: 1; }
  .tagline { position: absolute; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 500; color: #c6ccd4; letter-spacing: -.8px; }
  .tagline .w { display: inline-block; margin: 0 .12em; }
  .tagline .a { color: var(--amber); }

  /* code */
  .win { position: absolute; border: 1px solid #2a303a; border-radius: 22px; background: linear-gradient(#161a20, #111419); box-shadow: 0 50px 120px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.04); overflow: hidden; }
  .win-bar { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 24px; border-bottom: 1px solid #232830; font: 500 20px/1 "IBM Plex Mono", monospace; color: var(--muted); }
  .win-bar i { width: 13px; height: 13px; border-radius: 50%; background: #2c323c; }
  .win-bar span { margin-left: 14px; }
  .code { position: relative; padding: 34px 40px; font: 400 30px/1.75 "IBM Plex Mono", monospace; }
  .cl { position: relative; height: 1.75em; white-space: pre; }
  .cl .tx { display: inline-block; overflow: hidden; vertical-align: top; }
  .caret { position: absolute; top: .25em; width: 3px; height: 1.25em; background: var(--amber); }
  .hl { position: absolute; border-radius: 8px; pointer-events: none; }
  .t-kw { color: #c9a8ff; } .t-op { color: var(--amber); } .t-string { color: #9fe0b2; } .t-comment { color: #69727f; }
  .t-number, .t-directive { color: #ffa98a; } .t-type { color: #8fb8ff; } .t-model { color: #8fdcff; } .t-ph { color: #ffd27a; } .t-decl { color: var(--text); font-weight: 600; }

  .gate { position: absolute; width: 8px; border-radius: 8px; }
  .stamp { position: absolute; padding: 14px 30px; border: 5px solid var(--red); border-radius: 14px; color: var(--red); font: 700 54px/1 "IBM Plex Sans", sans-serif; letter-spacing: 6px; background: rgba(40,14,14,.7); }
  .note { position: absolute; font: 400 24px/1.4 "IBM Plex Mono", monospace; color: var(--muted); white-space: nowrap; }
  .note b { color: var(--red); font-weight: 500; }

  /* approval card */
  .card { position: absolute; width: 640px; border-radius: 24px; background: #171b22; border: 1px solid #2b313b; box-shadow: 0 60px 120px -40px rgba(0,0,0,.95); padding: 30px 32px; }
  .card .who { display: flex; align-items: center; gap: 16px; font-size: 26px; color: var(--text); font-weight: 600; }
  .card .who small { font-weight: 400; color: var(--muted); font-size: 22px; }
  .card .av { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffd98f, #f3a43c 70%); box-shadow: 0 0 22px rgba(243,180,76,.5); }
  .card .q { margin: 20px 0 24px; padding: 16px 20px; border-left: 4px solid #3a414c; background: #12151a; border-radius: 0 12px 12px 0; font-size: 24px; color: #c6ccd4; line-height: 1.45; }
  .card .btns { display: flex; gap: 14px; }
  .btn { position: relative; overflow: hidden; height: 64px; padding: 0 30px; border-radius: 14px; display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; }
  .btn.yes { background: var(--green); color: #07140d; }
  .btn.no { border: 1.5px solid #39404b; color: var(--muted); }
  .btn .rip { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.55); }
  .clock { position: absolute; padding: 12px 20px; border-radius: 12px; border: 1px solid #2b313b; background: #12151a; font: 500 26px/1 "IBM Plex Mono", monospace; color: var(--muted); white-space: nowrap; }
  .clock b { color: var(--text); font-weight: 500; }
  .z { position: absolute; font: 700 40px/1 "IBM Plex Sans", sans-serif; color: #c6ccd4; }
  .cursor { position: absolute; width: 44px; height: 44px; }
  .toast { position: absolute; padding: 16px 26px; border-radius: 14px; background: rgba(86,211,154,.12); border: 1.5px solid rgba(86,211,154,.5); color: var(--green); font: 500 26px/1 "IBM Plex Mono", monospace; white-space: nowrap; }

  /* plan */
  .term { position: absolute; font: 500 34px/1 "IBM Plex Mono", monospace; color: var(--text); white-space: pre; }
  .term .p { color: var(--amber); }
  .node { position: absolute; left: 0; top: 0; padding: 20px 26px; border-radius: 18px; background: #161a20; border: 1.5px solid #303741; font: 500 25px/1.2 "IBM Plex Mono", monospace; white-space: nowrap; text-align: center; }
  .node small { display: block; font-size: 19px; margin-top: 8px; color: var(--muted); }
  .node.read small { color: var(--green); } .node.ext small { color: var(--red); } .node.ag small { color: var(--amber); }
  .meter { position: absolute; height: 22px; border-radius: 22px; background: #1b2028; overflow: visible; }
  .meter .f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 22px; background: linear-gradient(90deg, #b9770e, var(--amber)); box-shadow: 0 0 30px rgba(243,180,76,.45); }
  .meter .lim { position: absolute; top: -18px; bottom: -18px; width: 4px; border-radius: 4px; background: var(--red); }
  .big-num { position: absolute; font: 600 64px/1 "IBM Plex Mono", monospace; letter-spacing: -1.5px; white-space: nowrap; }
  .lbl { position: absolute; font: 500 22px/1 "IBM Plex Mono", monospace; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

  /* replay */
  .track { position: absolute; height: 6px; border-radius: 6px; background: #252b34; }
  .track .done { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--amber); }
  .dot { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #2b313b; border: 3px solid #0b0d10; }

  /* montage */
  .slam { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 190px; letter-spacing: -8px; line-height: 1; white-space: nowrap; }
  .browser { position: absolute; width: 620px; height: 400px; border-radius: 22px; border: 2px solid #2f3640; background: #12151a; overflow: hidden; }
  .browser .bar { height: 54px; border-bottom: 2px solid #2f3640; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
  .browser .bar i { width: 12px; height: 12px; border-radius: 50%; background: #2f3640; }
  .browser .bar span { margin-left: 14px; padding: 8px 18px; border-radius: 10px; background: #1b2028; font: 400 19px/1 "IBM Plex Mono", monospace; color: var(--muted); }
  .bubble { position: absolute; padding: 16px 24px; border-radius: 22px; background: #1b2028; border: 1.5px solid #2f3640; font-size: 26px; color: #c6ccd4; white-space: nowrap; }
  .models { position: absolute; left: 0; right: 0; height: 90px; overflow: hidden; text-align: center; font: 600 64px/90px "IBM Plex Mono", monospace; color: var(--amber); }
  .install { position: absolute; padding: 22px 34px; border-radius: 18px; border: 1.5px solid #2f3640; background: #12151a; font: 500 32px/1 "IBM Plex Mono", monospace; white-space: pre; }
  .install .p { color: var(--amber); }
  .url { position: absolute; left: 0; right: 0; text-align: center; font: 600 40px/1 "IBM Plex Mono", monospace; color: var(--amber); letter-spacing: -.5px; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="grid"></div>
<div id="tint"></div>
<div id="world"></div>
<div id="fill"></div>
<div id="flash"></div>
<canvas id="grain" width="512" height="512"></canvas>
<div id="vignette"></div>
<div id="black"></div>
<script>
// ───────────────────────────── motion toolkit ─────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: (p) => p,
  outCubic: (p) => 1 - (1 - p) ** 3,
  outQuart: (p) => 1 - (1 - p) ** 4,
  outExpo: (p) => (p >= 1 ? 1 : 1 - 2 ** (-10 * p)),
  inCubic: (p) => p * p * p,
  inQuad: (p) => p * p,
  inExpo: (p) => (p <= 0 ? 0 : 2 ** (10 * p - 10)),
  inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2),
  inOutQuint: (p) => (p < 0.5 ? 16 * p ** 5 : 1 - (-2 * p + 2) ** 5 / 2),
  inOutSine: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
  outBack: (p, s = 1.70158) => 1 + (s + 1) * (p - 1) ** 3 + s * (p - 1) ** 2,
};
// progress of a tween that starts at t0 and lasts d, eased
const P = (t, t0, d, e = E.outCubic) => e(clamp((t - t0) / d));
// a damped spring from 0 to 1, x seconds after it was released (w: stiffness, z: damping ratio)
function spring(x, w = 16, z = 0.42) {
  if (x <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
// the wobble left after an impact: a decaying sine, x seconds after it
const wobble = (x, f = 9, d = 5) => (x <= 0 ? 0 : Math.sin(x * f * Math.PI * 2) * Math.exp(-x * d));
// smooth deterministic noise in [-1, 1]
const noise = (x, s = 0) => (Math.sin(x * 1.31 + s) * 0.5 + Math.sin(x * 2.73 + s * 1.7) * 0.3 + Math.sin(x * 5.17 + s * 2.3) * 0.2);
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
// a window: 0 before a, ramps in over ai, holds, ramps out over ao ending at b
const win = (t, a, b, ai = 0.3, ao = 0.3) => Math.min(P(t, a, ai, E.outCubic), 1 - P(t, b - ao, ao, E.inOutCubic));

const W = 1920, H = 1080, CX = 960, CY = 540;
const world = document.getElementById("world");
const D = window.SCENE_DATA || { code: [], install: "" };
function el(tag, cls, parent = world, html = "") {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
const layer = (id) => { const e = el("div", "layer"); e.id = id; return e; };
// place an element by its centre
function put(e, x, y, s = 1, r = 0, o = 1, blur = 0, extra = "") {
  e.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) rotate(${r}deg) scale(${s})${extra}`;
  e.style.opacity = o;
  e.style.filter = blur > 0.05 ? `blur(${blur}px)` : "";
}
const show = (e, on) => (e.style.visibility = on ? "visible" : "hidden");

// ───────────────────────────── the character ─────────────────────────────
let orbN = 0;
function makeOrb(parent) {
  const id = `o${orbN++}`;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "orb");
  svg.setAttribute("viewBox", "-230 -230 460 460");
  svg.innerHTML = `
    <defs>
      <radialGradient id="${id}g" r="0.5"><stop offset="0" stop-color="#ffc35c" stop-opacity=".55"/><stop offset=".45" stop-color="#f3a43c" stop-opacity=".16"/><stop offset="1" stop-color="#f3a43c" stop-opacity="0"/></radialGradient>
      <radialGradient id="${id}b" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffe3a6"/><stop offset=".45" stop-color="#ffbe55"/><stop offset="1" stop-color="#e48a1c"/></radialGradient>
      <filter id="${id}f" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle class="glow" r="170" fill="url(#${id}g)"/>
    <g class="body">
      <circle r="62" fill="url(#${id}b)"/>
      <ellipse cx="-20" cy="-30" rx="17" ry="10" fill="#fff" opacity=".42" transform="rotate(-28 -20 -30)"/>
      <g class="eyes">
        <g class="eL"><rect x="-6" y="-14" width="12" height="28" rx="6" fill="#241505"/></g>
        <g class="eR"><rect x="-6" y="-14" width="12" height="28" rx="6" fill="#241505"/></g>
      </g>
      <g class="happy" fill="none" stroke="#241505" stroke-width="7" stroke-linecap="round">
        <path d="M-30 2 Q-21 -12 -12 2"/><path d="M12 2 Q21 -12 30 2"/>
      </g>
      <g class="sleep" fill="none" stroke="#241505" stroke-width="7" stroke-linecap="round">
        <path d="M-30 0 Q-21 7 -12 0"/><path d="M12 0 Q21 7 30 0"/>
      </g>
      <g class="ouch" fill="none" stroke="#241505" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-30 -8 L-14 0 L-30 8"/><path d="M30 -8 L14 0 L30 8"/>
      </g>
    </g>
    <g class="halo"><ellipse rx="64" ry="17" fill="none" stroke="#fff" stroke-width="8" filter="url(#${id}f)"/></g>`;
  parent.appendChild(svg);
  const q = (s) => svg.querySelector(s);
  return { svg, glow: q(".glow"), body: q(".body"), eyes: q(".eyes"), eL: q(".eL"), eR: q(".eR"), happy: q(".happy"), sleep: q(".sleep"), ouch: q(".ouch"), halo: q(".halo"), ring: q(".halo ellipse") };
}
// s: x, y, scale, rot, sq (squash +, stretch -), lookX/lookY (-1..1), blink, wink, eye (size), happy, sleep, ouch,
//    halo (0..1 shown), haloY (offset from rest), haloWob, haloTilt, haloColor, glow, opacity, blur
function orb(o, s) {
  const sc = s.scale ?? 1, sq = s.sq ?? 0;
  put(o.svg, s.x ?? CX, s.y ?? CY, sc, s.rot ?? 0, s.opacity ?? 1, s.blur ?? 0);
  const sx = 1 + sq * 0.28, sy = 1 - sq * 0.28;
  o.body.setAttribute("transform", `translate(0 62) scale(${sx} ${sy}) translate(0 -62)`);
  o.glow.setAttribute("opacity", s.glow ?? 1);
  const ey = s.eye ?? 1, blink = clamp(s.blink ?? 0), wink = clamp(s.wink ?? 0);
  const lx = (s.lookX ?? 0) * 10, ly = (s.lookY ?? 0) * 8;
  const moods = clamp((s.happy ?? 0) + (s.sleep ?? 0) + (s.ouch ?? 0));
  o.eyes.setAttribute("opacity", 1 - moods);
  o.eL.setAttribute("transform", `translate(${-21 + lx} ${-4 + ly}) scale(${ey} ${ey * Math.max(0.08, 1 - blink)})`);
  o.eR.setAttribute("transform", `translate(${21 + lx} ${-4 + ly}) scale(${ey} ${ey * Math.max(0.08, 1 - Math.max(blink, wink))})`);
  o.happy.setAttribute("opacity", s.happy ?? 0);
  o.happy.setAttribute("transform", `translate(${lx * 0.5} ${ly * 0.5})`);
  o.sleep.setAttribute("opacity", s.sleep ?? 0);
  o.ouch.setAttribute("opacity", s.ouch ?? 0);
  const h = s.halo ?? 0;
  const top = -62 * sy * 2 + 62 - 34; // above the squashed body
  const wob = s.haloWob ?? 0;
  o.halo.setAttribute("opacity", h);
  o.halo.setAttribute("transform", `translate(0 ${top + (s.haloY ?? 0)}) rotate(${s.haloTilt ?? 0}) scale(${1 + wob * 0.12} ${1 - wob * 0.25})`);
  o.ring.setAttribute("stroke", s.haloColor ?? "#fff");
}

// ───────────────────────────── shared pieces ─────────────────────────────
function headline(parts, y, parent, size) {
  const h = el("div", "headline", parent);
  h.style.top = `${y}px`;
  if (size) h.style.fontSize = `${size}px`;
  h.innerHTML = parts.map(([w, c]) => `<span class="w ${c || ""}">${w}</span>`).join("");
  return { el: h, words: [...h.children] };
}
// words rise in as a wave (gaps shrink), and leave together, faster
function wave(hd, t, tin, tout = 1e9, opts = {}) {
  const dist = opts.dist ?? 46, dur = opts.dur ?? 0.62;
  const out = P(t, tout, 0.26, E.inCubic);
  show(hd.el, t >= tin - 0.01 && out < 1);
  hd.words.forEach((w, i) => {
    const delay = 0.075 * i ** 0.82;
    const p = P(t, tin + delay, dur, E.outExpo);
    w.style.transform = `translateY(${(1 - p) * dist - out * 26}px) rotate(${(1 - p) * 3}deg)`;
    w.style.opacity = p * (1 - out);
    const b = (1 - p) * 10 + out * 6;
    w.style.filter = b > 0.05 ? `blur(${b}px)` : "";
  });
}
function chip(label, kind, parent) { return el("div", `chip ${kind}`, parent, `<i></i><b>${label}</b>`); }
// particles: a fixed pool, handed out to shatters by index
const POOL = [];
const pl = layer("particles");
for (let i = 0; i < 260; i++) POOL.push(el("div", "pt", pl));
let poolUsed = 0;
const shatters = [];
function shatter(t0, x, y, color, n, spread = 1) {
  const s = { t0, x, y, color, from: poolUsed, n, spread };
  poolUsed += n;
  shatters.push(s);
  return s;
}
function drawShatters(t) {
  for (const p of POOL) p.style.opacity = 0;
  for (const s of shatters) {
    const x = t - s.t0;
    if (x < 0 || x > 1.4) continue;
    for (let k = 0; k < s.n; k++) {
      const i = s.from + k, p = POOL[i];
      const a = hash(i) * Math.PI * 2, v = (260 + hash(i + 7) * 620) * s.spread;
      const px = s.x + Math.cos(a) * v * x * (1 - x * 0.35);
      const py = s.y + Math.sin(a) * v * x * (1 - x * 0.35) + 520 * x * x;
      const size = 6 + hash(i + 3) * 14;
      p.style.width = p.style.height = `${size}px`;
      p.style.background = s.color;
      p.style.opacity = clamp(1 - x / 1.1);
      p.style.transform = `translate(${px}px, ${py}px) rotate(${hash(i + 5) * 720 * x}deg)`;
    }
  }
}
function shock(parent) { return el("div", "ring", parent); }
function drawShock(r, t, t0, x, y, max = 1300, color = "#fff", dur = 0.8) {
  const p = P(t, t0, dur, E.outExpo);
  const on = t >= t0 && p < 1;
  show(r, on);
  if (!on) return;

const shock9 = shock(L9);
const word9 = el("div", "wordmark", L9, "Halo");
const tag9 = el("div", "tagline", L9, ["AI", "agents", "that", "do", "real", "work,"].map((w) => `<span class="w">${w}</span>`).join("") + "<br>" + [["inside", ""], ["rules", "a"], ["you", "a"], ["write.", "a"]].map(([w, c]) => `<span class="w ${c}">${w}</span>`).join(""));
const tag9w = [...tag9.querySelectorAll(".w")];
const install = el("div", "install", L9);
const url = el("div", "url", L9, "halolang.com");
const INSTALL = D.install || "curl -fsSL https://halolang.com/install.sh | sh";
cue(48.55, "merge"); cue(48.9, "boom", { light: true }); cue(49.4, "whoosh"); for (let k = 0; k < INSTALL.length; k += 3) cue(50.9 + (k / INSTALL.length) * 0.9, "key", { soft: k % 2 === 0 });
cue(52.2, "chord"); cue(52.95, "wink");

function scene9(t) {
  const on = t >= S.outro - 0.1;
  show(L9, on);
  if (!on) return;
  const o = mOrbs[0];
  const toSide = P(t, 49.4, 0.85, E.inOutQuint);
  const wink = Math.sin(clamp((t - 52.95) / 0.32) * Math.PI);
  const hop = Math.max(0, Math.sin(clamp((t - 53.0) / 0.4) * Math.PI));
  orb(o, {
    x: lerp(CX, 600, toSide), y: lerp(540, 395, toSide) - hop * 30, scale: lerp(0.66, 0.86, toSide),
    sq: wobble(t - 48.55, 3, 6) * 0.5 + wobble(t - 48.9, 2.6, 5.5) * 0.45 - hop * 0.2,
    happy: P(t, 49.1, 0.15) * (1 - P(t, 50.4, 0.2)), wink, lookX: P(t, 52.6, 0.25) * 0.5,
    halo: t >= 48.6 ? 1 : 0, haloY: -520 * (1 - P(t, 48.6, 0.3, E.inCubic)), haloWob: wobble(t - 48.9, 4.5, 4), haloTilt: wobble(t - 48.95, 3, 4) * 8,
    glow: 1 + Math.exp(-Math.max(0, t - 48.9) * 3) * (t > 48.9 ? 1.4 : 0),
  });
  drawShock(shock9, t, 48.9, CX, 540 - 70, 1300, "#fff", 0.9);
  if (t >= 48.9) document.getElementById("flash").style.opacity = Math.exp(-(t - 48.9) * 9) * 0.25;
  const wm = P(t, 49.55, 0.9, E.outExpo);
  word9.style.left = "735px"; word9.style.top = "240px";
  word9.style.clipPath = `inset(-20% ${(1 - wm) * 100}% -20% 0)`;
  word9.style.transform = `translateX(${(1 - wm) * -120}px)`;
  tag9.style.top = "560px";
  tag9w.forEach((w, i) => {
    const p = P(t, 50.0 + 0.055 * i ** 0.85, 0.6, E.outExpo);
    w.style.transform = `translateY(${(1 - p) * 30}px)`; w.style.opacity = p; w.style.filter = p < 1 ? `blur(${(1 - p) * 8}px)` : "";
  });
  const ip = P(t, 50.7, 0.5, E.outExpo);
  const k = Math.round(P(t, 50.9, 0.9, E.lin) * INSTALL.length);
  install.innerHTML = `<span class="p">$</span> ${INSTALL.slice(0, k)}${Math.floor(t * 2.4) % 2 === 0 || t < 51.8 ? '<span style="color:#f3b44c">▍</span>' : " "}`;
  put(install, CX, 790, 1, 0, ip, (1 - ip) * 6, ` translateY(${(1 - ip) * 20}px)`);
  const up = P(t, 52.2, 0.6, E.outExpo);
  url.style.top = "905px"; url.style.opacity = up; url.style.transform = `translateY(${(1 - up) * 16}px)`;
  url.style.letterSpacing = `${lerp(8, -0.5, up)}px`;
  document.getElementById("black").style.opacity = P(t, S.end - 0.9, 0.9, E.inOutCubic);
}

// ───────────────────────────── grain ─────────────────────────────
const gc = document.getElementById("grain").getContext("2d");
const gimg = gc.createImageData(512, 512);
for (let i = 0; i < gimg.data.length; i += 4) { const v = Math.floor(hash(i * 0.37) * 255); gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255; }
gc.putImageData(gimg, 0, 0);
const grain = document.getElementById("grain");
grain.style.width = "2304px"; grain.style.height = "1296px";
grain.style.imageRendering = "pixelated";

world.appendChild(pl);
window.DURATION = S.end;
window.render = (t) => {
  world.style.transform = ""; world.style.transformOrigin = "960px 540px";
  // global overlays are reset every frame, so no scene's last value leaks into the next
  for (const id of ["flash", "tint", "grid", "black"]) document.getElementById(id).style.opacity = 0;
  document.getElementById("bg").style.background = "";
  // the orb fills the screen: an amber flash into the montage
  document.getElementById("fill").style.opacity = P(t, 41.45, 0.35, E.inCubic) * (1 - P(t, S.montage + 0.05, 0.3));
  scene1(t); scene4(t); scene6(t); scene8(t); scene9(t);
  drawShatters(t);
  const f = Math.floor(t * 24);
  grain.style.transform = `translate(${-hash(f) * 380}px, ${-hash(f + 9) * 210}px)`;
};
CUES.sort((a, b) => a.t - b.t);
window.AUDIO_EVENTS = CUES;
window.AUDIO_SECTIONS = S;
window.render(0);
</script>
</body>
</html>
