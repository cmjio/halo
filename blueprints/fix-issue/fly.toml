# Fly.io: fly launch --copy-config --no-deploy, then see README.md ("Deploy").
# Fly machines have no Docker, so the agent's sandbox is an E2B (or Daytona) one: set E2B_API_KEY.
app = "fix-issue"
primary_region = "iad"

[build]

[env]
  HALO_PUBLIC_URL = "https://fix-issue.fly.dev"

[mounts]
  source = "halo_state"
  destination = "/app/.halo"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: it holds paused runs waiting for review.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
