# Fly.io: fly launch --copy-config --no-deploy, then see README.md ("Deploy").
app = "web-monitor"
primary_region = "iad"

[build]

[env]
  HALO_PUBLIC_URL = "https://web-monitor.fly.dev"

[mounts]
  source = "halo_state"
  destination = "/app/.halo"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: it holds paused runs, and schedules and watches run in it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
